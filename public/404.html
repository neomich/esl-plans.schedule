<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages has no server-side routing, so a direct visit to
      // e.g. /abc/schedule returns this 404 page. We encode the real
      // path into a query string and redirect to index.html, which
      // decodes it and restores the correct URL before the app loads.
      // (Standard pattern: https://github.com/rafgraph/spa-github-pages)
      var pathSegmentsToKeep = 0; // 0 because this runs at the domain root
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
